# SwiftLint config for Zest.
#
# Defaults are noisy on this codebase: single-letter loop indices (`i`, `r`),
# short-lived FFI locals (`p`, `q`, `h`), trailing commas in collection
# literals (which `.swift-format` explicitly enables), and the C-bridge
# data→string conversion in `ZestCore` all trigger stock rules. The disables
# below keep lint focused on the rules that catch real bugs, not the
# pedantic style ones the team hasn't adopted.

disabled_rules:
  - identifier_name           # single-letter indices + FFI locals are idiomatic here
  - trailing_comma            # .swift-format config has multiElementCollectionTrailingCommas: true
  - closure_parameter_position # multi-line closure params are common in our views
  - opening_brace             # we allow type bodies to start on the next line
  - nesting                   # 2-level nesting is used for view controller inner types
  - large_tuple               # 3-tuples are returned in a few hot paths
  - cyclomatic_complexity     # sort comparators in AppCoordinator legitimately branch on kind/cmp
  - optional_data_string_conversion  # ZestCore intentionally decodes raw pointer bytes
  - type_body_length
  - file_length
  - function_body_length
  - line_length               # .swift-format has its own lineLength: 100
  - force_cast
  - force_try

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - sorted_first_last
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing

excluded:
  - .build
  - zig-out
  - docs

# Treat warnings as errors so `just lint` fails on real issues, not noise.
strict: false
